name: Daily Ecommerce Sentiment Pipeline

on:
  # Run automatically every day at 06:00 UTC
  schedule:
    - cron: '0 6 * * *'
  
  # Allow manual trigger via GitHub UI
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv Package Manager
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Install Dependencies
        run: |
          uv sync

      - name: Step 1 - Ingest Daily Reviews & Run HuggingFace Sentiment
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCS_BUCKET_NAME: "ecommerce-raw-data-mohammed"
        run: |
          PYTHONPATH=. uv run python scripts/ingest_daily_delta.py

      - name: Step 2 - Refresh BigQuery External Tables
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCS_BUCKET_NAME: "ecommerce-raw-data-mohammed"
        run: |
          PYTHONPATH=. uv run python scripts/create_external_tables.py

      - name: Step 3 - Execute dbt Transformations & Tests
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          cd dbt_transforms
          uv run dbt deps
          uv run dbt run
          uv run dbt test

      - name: Step 4 - Query Anomalies & Send Discord Alerts
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          PYTHONPATH=. uv run python scripts/send_alerts.py
          